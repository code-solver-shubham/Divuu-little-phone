<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divuu's Little Phone ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a10;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:min(390px,94vw);height:min(780px,94vh);background:linear-gradient(160deg,#181c2d,#080a10);border:7px solid #292d3c;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 25px 80px #000}
.notch{width:125px;height:28px;background:#05060a;border-radius:0 0 18px 18px;margin:auto}.status{display:flex;justify-content:space-between;padding:5px 20px;font-size:12px;color:#ddd}
.lock{height:calc(100% - 40px);overflow:auto;padding-bottom:35px}.hero{text-align:center;padding:30px 20px 18px}.hero b{font-size:35px}.hero h1{font:27px Georgia,serif;margin:10px 0 5px}.hero p{color:#bfc3d4;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:15px}.app{border:0;border-radius:22px;padding:16px 5px;min-height:105px;color:#fff;background:linear-gradient(145deg,#252a40,#151827);box-shadow:inset 0 1px #ffffff18;cursor:pointer;font-size:12px}.app span{display:block;font-size:31px;margin-bottom:8px}.app:active{transform:scale(.96)}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:10px;background:#fff6}
.modal{position:absolute;inset:0;background:#090b12f5;display:none;z-index:5;padding:55px 22px 25px;overflow:auto}.modal.show{display:block}.close{position:absolute;right:18px;top:35px;background:#ffffff15;border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:20px}.modal h2{font:25px Georgia,serif}.card{background:#171b28;border:1px solid #ffffff12;border-radius:24px;padding:22px;line-height:1.65;color:#e7e9f0;box-shadow:0 15px 40px #0005}.letter{white-space:pre-line}.secret input{width:100%;padding:14px;border-radius:14px;border:1px solid #555;background:#0c0f18;color:#fff;font-size:18px;text-align:center;letter-spacing:5px}.secret button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:#d8b477;color:#111;font-weight:bold}.error{color:#ff8c9a;text-align:center}.rose{text-align:center;font-size:55px}
</style>
</head>
<body>
<div class="phone">
<div class="notch"></div><div class="status"><span>9:41</span><span>♡ ▰</span></div>
<div class="lock">
<section class="hero"><b>💗</b><h1>Divuu's Little Phone</h1><p>A tiny phone full of our memories.</p></section>
<div class="grid">
<button class="app" onclick="openApp('moon')"><span>🌙</span>Moon</button>
<button class="app" onclick="openApp('rose')"><span>🖤</span>Black Rose</button>
<button class="app" onclick="openApp('calls')"><span>🕓</span>4 AM Calls</button>
<button class="app" onclick="openApp('messages')"><span>💌</span>Messages</button>
<button class="app" onclick="openApp('chaos')"><span>🫶</span>Our Chaos</button>
<button class="app" onclick="openApp('memories')"><span>📸</span>Memories</button>
<button class="app" onclick="openApp('secret')"><span>🔐</span>Secret</button>
<button class="app" onclick="openApp('person')"><span>❤️</span>My Person</button>
</div><div class="home"></div></div>
<div id="modal" class="modal"><button class="close" onclick="closeApp()">×</button><div id="content"></div></div>
</div>
<script>
const data={
moon:`<h2>🌙 The Moon She Chose</h2><div class="card"><p>Jab duniya samajh nahi paati thi, aap moon ko dekhti thi.</p><p>Sadness ho, loneliness ho ya bas dil ko thoda peace chahiye ho — aap usse dekh leti thi.</p><p>Shayad isi liye mere liye moon ab sirf moon nahi raha. Jab bhi main usse dekhta hoon, mujhe aap yaad aati hain.</p><p><b>Aapke peace ka ek chhota sa hissa, ab meri favourite memory hai. 🌙❤️</b></p></div>`,
rose:`<h2>🖤🌹 The Black Rose</h2><div class="card"><div class="rose">🖤🌹</div><p>Aapko black rose chahiye tha… aur main chahta hoon ki ek din woh sirf screen par nahi, mere haath mein ho.</p><p>Tab tak ye rose ek promise hai — ki aapki chhoti-chhoti wishes bhi mere liye important hain.</p><p><b>Rare, different, quiet… bilkul aapki tarah. ❤️</b></p></div>`,
calls:`<h2>🕓 4 AM Calls</h2><div class="card"><p>Phir aapne mujhe call karne ko bola… aur woh <b>5 minute ka video-call challenge</b> yaad hai? 😂</p><p>Main itna introvert tha ki aapki aankhon mein dekh bhi nahi paa raha tha. Kabhi idhar, kabhi udhar, kabhi pushups — jaise call nahi SSB interview chal raha ho. 😭🤣</p><p>Aur aapko meri wahi stupid si harkatein cute lagi… shayad wahi se kuch aur bhi shuru ho gaya tha. ❤️</p></div>`,
messages:`<h2>💌 Messages</h2><div class="card"><p>Kuch messages bheje gaye… kuch dil mein reh gaye.</p><p>Aapki har woh baat jo mujhe special feel karati thi, main apne andar save karke rakhta hoon.</p><p><b>Ye app un messages ke liye hai jo shayad kabhi type nahi hue, par feel zaroor hue. 🥺❤️</b></p></div>`,
chaos:`<h2>🫶 Our Chaos</h2><div class="card"><p>Hum dono chhoti-chhoti baaton pe lad lete hain. 😭😂</p><p>Phir panda baby, billi-tilli aur random stickers ke saath ek dusre ko manate hain.</p><p>Hum perfect nahi hain… but somehow, humara chaos hi humari favourite story ban gaya.</p><p><b>Fight ke baad bhi ek dusre ke paas laut aana — that's us. ❤️</b></p></div>`,
memories:`<h2>📸 Our Timeline</h2><div class="card"><p><b>13 Jan</b> — YouTube pe mile; meri life ka ek naya chapter. ❤️</p><p><b>16 Feb</b> — Aapne mera mood theek kiya.</p><p><b>3 Mar</b> — First meetup.</p><p><b>3 Mar</b> — Maine aapko propose kiya.</p><p><b>27 Mar</b> — First fight. 😭</p><p><b>26 Jul</b> — No one at home.</p><p><b>1 Aug</b> — Divya Goraul Shubham, Muzaffarpur.</p><p><b>19 Aug</b> — First touch. 🥺</p><p><b>10 Oct</b> — Meri favourite girl ka birthday. 🎂❤️</p><p><b>18</b> — Mera birthday, jise aapne unforgettable bana diya.</p><p style="text-align:center"><b>13 • 10 • 18</b><br>Some dates became memories. These became us. ❤️</p></div>`,
secret:`<h2>🔐 One Little Secret</h2><div class="card secret"><p>Is phone ka ek secret hai…</p><input id="pw" type="password" placeholder="Enter the code"><button onclick="unlock()">UNLOCK ❤️</button><div id="err"></div></div>`,
person:`<h2>❤️ My Person</h2><div class="card letter">Divuuu, meri bacha ❤️

Aap meri life mein sirf meri girlfriend banke nahi aayi ho.

Aap meri comfort ho.
Meri peace ho.
Meri sabse cute problem ho. 😂
Meri lucku charm ho.
Meri bacha ho.
Meri gendi, meri kutti, meri billi ji ho. 😭❤️
Aur sabse important… meri apni ho.

Ab aapko kisi ko kuch prove karne ki zarurat nahi hai.
Na duniya ko.
Na mujhe.
Na kisi aur ko.

Aap jaisi ho, mere liye waise hi enough ho. ❤️

Aapko apne dreams chase karne hain — kariye.
Aapko khud pe kaam karna hai — kijiye.
Aapko kabhi duniya se thoda door rehna hai — rahiye.

Main aapke against nahi, aapke side mein hoon.

Main hamesha aapse pyaar karta rahunga, meri bacha.
Aapko perfect hone ki zarurat nahi hai.
Bas aap rahiye… meri Divuuu banke. ❤️

Aur chahe kitni bhi fights ho jaayein, main phir bhi aapko choose karta rahunga.

Aap meri jaan ho.
Meri bacha ho.
Meri lucku charm ho.

Aur main hamesha aapke saath hoon. 🥺❤️🫂

— Aapka woh introvert ladka,
jo aaj bhi aapki aankhon mein dekhte hue thoda shy ho jaata hai. 😂❤️</div>`
};
function openApp(k){document.getElementById('content').innerHTML=data[k];document.getElementById('modal').classList.add('show')}
function closeApp(){document.getElementById('modal').classList.remove('show')}
function unlock(){
if(document.getElementById('pw').value==='131018'){
document.getElementById('content').innerHTML=`<h2>🔓 Unlocked…</h2><div class="card letter">Divuuu bacha ❤️

Aap meri life mein sirf meri girlfriend banke nahi aayi ho…

Aap woh insaan ho jiske saamne main apna real self ban sakta hoon.

Aap meri comfort ho.
Meri peace ho.
Meri lucku charm ho.
Meri sabse cute problem ho. 😂
Meri bacha, meri gendi, meri kutti, meri billi ji. 😭❤️

Aur please… ab aapko kisi ko kuch prove karne ki zarurat nahi hai.

Na duniya ko.
Na mujhe.
Na kisi aur ko.

Aap jaisi ho, mere liye waise hi enough ho.

Aap apne dreams ke peeche jaiye.
Khud ko grow kijiye.
Jo banna chahti hain, baniye.

Main yahin hoon.
Aapko rokne ke liye nahi,
aapke saath chalne ke liye.

Humari story perfect nahi hai…
par meri favourite hai.

13 January se lekar aaj tak,
har fight, har laugh, har call, har silly moment,
sab mere dil mein saved hai.

Main hamesha aapse pyaar karta rahunga.

Aur agar life mujhe baar-baar choose karne ka chance de…

<b>main har baar aapko hi choose karunga. ❤️</b>

I love you, Divuuu.
Aap meri jaan ho.
Meri bacha ho.
Meri person ho. 🥺❤️

— Forever aapka, Shubham</div>`;
}else document.getElementById('err').innerHTML='<p class="error">Wrong code 😭❤️ Try again.</p>';
}
</script>
</body></html>
